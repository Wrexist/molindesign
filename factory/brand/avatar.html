<!doctype html><meta charset="utf-8">
<!-- Profile picture for the factory's TikTok account: the caret from "Next word" after the letters AI.
     Render: node factory/brand/render-avatar.mjs -->
<style>
@font-face{font-family:Archivo;src:url(../../film/fonts/Archivo-normal-100_900.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;background:#15131b}
#c{width:1080px;height:1080px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 46%,#221f2b 0,#15131b 62%)}
.word{position:absolute;left:50%;top:50%;transform:translate(-56%,-54%);display:flex;align-items:center;gap:22px}
.ai{font:900 430px/1 Archivo,sans-serif;color:#f4ede0;letter-spacing:-18px}
.caret{width:46px;height:380px;border-radius:12px;background:#ff5b3d}
.odds{position:absolute;left:50%;top:742px;transform:translateX(-50%);display:flex;gap:14px}
.odds i{display:block;height:26px;border-radius:13px;background:#f4ede0;opacity:.22}
.odds i:first-child{background:#ff5b3d;opacity:1}
</style>
<div id="c"><div class="word"><span class="ai">AI</span><span class="caret"></span></div>
<div class="odds"><i style="width:200px"></i><i style="width:96px"></i><i style="width:52px"></i></div></div>
